# Bitify relay - ONE service from this blueprint (Render Dashboard: New -> Blueprint):
#   bitify-listen-together  Listen Together + accounts + Messages + vault (Go backend)
#
# The old `bitify-relay` node service (a YouTube CORS middle-man that only the web
# app used) has been REMOVED: the web app is gone, so nothing called it, and dropping
# it halves the Render free-tier burn. One service 24/7 (~730 h) stays inside the
# 750 instance-hours/month an account gets; two did not.
#
# BACKUP / SECOND SERVER: deploy this same repo again on a *different* Render
# account to get a second copy of the server. On BOTH accounts set the SAME
# DATABASE_URL and the SAME SYNC_SECRET (the `sync: false` vars below), so the two
# share one database and can read each other's sealed documents. The apps then fall
# back to the backup when the primary does not answer.

services:
  - type: web
    name: bitify-listen-together
    runtime: go
    plan: free
    region: singapore
    rootDir: listen-together
    buildCommand: go build -o server .
    startCommand: ./server
    healthCheckPath: /healthz
    numInstances: 1
    # A new commit to this repo deploys both accounts automatically.
    autoDeploy: true
    envVars:
      - key: JAM_MAX_MEMBERS
        value: "5"
      - key: JAM_STATE_HEARTBEAT_MS
        value: "5000"
      - key: JAM_MAX_UPCOMING_QUEUE
        value: "25"
      - key: JAM_MAX_PARTIES
        value: "50"
      - key: JAM_CREATE_RATE_PER_MINUTE
        value: "2"
      - key: JAM_CONNECTION_IDLE_MS
        value: "900000"
      # Render terminates TLS and supplies the real client IP in X-Forwarded-For.
      - key: JAM_TRUST_PROXY
        value: "true"
      # Only browser clients are refused without a matching Origin; the native
      # phone/TV/Wear/desktop apps send no Origin and stay allowed. The web app is
      # gone, so this is only for local tooling.
      - key: JAM_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173"
      # Set to the public https origin (e.g. https://party.example.com) when a
      # proxy in front of Render may not carry X-Forwarded-Proto through;
      # invite deep links then use it verbatim.
      - key: JAM_PUBLIC_ORIGIN
        sync: false
      # Postgres/Neon connection string. WITHOUT it the account endpoints answer 503
      # and the app keeps working signed-out. Set the SAME value on the backup
      # server so both read one database.
      - key: DATABASE_URL
        sync: false
      # Private key for GET /api/admin/stats and the /admin panel. Blank disables
      # both (404).
      - key: JAM_ADMIN_KEY
        sync: false
      # Seals each account's synced document (playlists, Discord token, Spotify
      # cookie) before it is written to Neon. MUST be identical on the primary and
      # the backup. Set it once and keep it forever: changing it makes every stored
      # document unreadable.
      - key: SYNC_SECRET
        sync: false
      # The Web OAuth client id from Google Cloud, used by Android's Credential
      # Manager. Same value on both servers.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # The Desktop-app OAuth client id, used by the PC's browser sign-in.
      - key: GOOGLE_DESKTOP_CLIENT_ID
        sync: false
      - key: JAM_SESSION_DAYS
        value: "180"
      - key: JAM_AUTH_RATE_PER_MINUTE
        value: "10"
