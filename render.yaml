# Bitify Relay — Turnkey deploy for the site's relay server
# One Web service, free plan, no build (plain Node ≥ 20).
#
#   1. "Deploy to Render" button on the README
#   2. copy the https://…onrender.com URL
#   3. set it as VITE_RELAY_URL when building web/app (or in Settings)
#
# The relay is stateless: nothing to give it, nothing it keeps.
services:
  - type: web
    name: bitify-relay
    runtime: node
    plan: free
    buildCommand: echo "no build step needed"
    startCommand: node server.mjs
    # A new commit to this repo is deployed automatically.
    autoDeploy: true
